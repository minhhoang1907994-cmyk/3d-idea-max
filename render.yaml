# Cấu hình deploy Render.
#
# QUAN TRỌNG: đây là STATIC SITE, không phải Web Service.
# App không có backend — toàn bộ chạy trong trình duyệt. Deploy dạng Web Service
# sẽ luôn fail với "No open ports detected on 0.0.0.0" vì không có server nào
# lắng nghe cả; `npm run dev` chỉ là dev server, không dùng cho production.
services:
  - type: web
    runtime: static
    name: 3d-idea-max
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Chuỗi kết nối Neon của role app_editor (KHÔNG dùng neondb_owner).
      # Đặt giá trị trong Render Dashboard > Environment — sync: false nghĩa là
      # Render không lấy từ file này. Xem docs/neon-setup.md.
      - key: VITE_NEON_DATABASE_URL
        sync: false
      # Backblaze B2 — nơi lưu ảnh của Sổ công ty. Cũng đặt giá trị trong Dashboard.
      # Bốn biến này nằm trong bundle nên key PHẢI giới hạn đúng bucket đang dùng;
      # thiếu chúng thì ô "Hình ảnh" quay về dạng dán link. Xem docs/backblaze-setup.md.
      # Nhớ thêm origin của site này vào CORS rule của bucket, nếu không upload sẽ hỏng.
      - key: VITE_B2_KEY_ID
        sync: false
      - key: VITE_B2_APPLICATION_KEY
        sync: false
      - key: VITE_B2_BUCKET
        sync: false
      - key: VITE_B2_ENDPOINT
        sync: false
    # Điều hướng giữa 2 trang làm bằng state, không đổi URL, nên không cần
    # rewrite rule cho SPA. Nếu sau này thêm react-router thì mở khối dưới ra:
    # routes:
    #   - type: rewrite
    #     source: /*
    #     destination: /index.html
    headers:
      # File có hash trong tên nên cache vĩnh viễn được
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html phải luôn lấy bản mới để trỏ đúng bundle sau mỗi lần deploy
      - path: /index.html
        name: Cache-Control
        value: no-cache
